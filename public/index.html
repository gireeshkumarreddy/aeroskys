<script id="intro-bootstrap">
(()=>{const root=document.documentElement;try{
 const h=location.hash;if(h&&h!=='#'&&h!=='#/'&&!h.startsWith('#/?'))return;

 let seen=false,session=false;try{seen=localStorage.getItem('aeroskys:intro-seen')==='1';session=sessionStorage.getItem('aeroskys:intro-session')==='1'}catch(e){}
 if(seen&&session)return;
 const mode=matchMedia('(prefers-reduced-motion: reduce)').matches?'reduced':seen?'returning':'full';
 root.classList.add('intro-pending');root.dataset.introMode=mode;
 const release=()=>{root.classList.remove('intro-pending','intro-running','intro-revealing','intro-landed');root.classList.add('intro-complete','intro-skipped');const o=document.getElementById('brand-intro');if(o)o.remove();document.dispatchEvent(new Event('aeroskys:intro-complete'))};

}catch(e){root.classList.remove('intro-pending')}})();
</script>
